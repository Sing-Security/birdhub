# client = "laptop.example"
# targets = ["@peer/build-box.example"]

# [[grants]]
# client = "build-box.example"
# targets = ["cache.internal:3128", "@peer/laptop.example"]

# [[grants]]
# client = "serving-box.example"   # reachable by the peers granted above;
# targets = []                     # asks the hub for nothing itself
