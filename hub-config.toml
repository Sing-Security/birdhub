# ==============================================================================
# birdhub — hub
# ==============================================================================
#
# Terminates Temper sessions and, per client, either dials the targets its
# grant allows or pairs it with another node (`@peer/<subject>`) so the two
# can run their own end-to-end session through this one.
#
# Before this config means anything, the hub needs its papers. Once, for the
# fleet (on the machine that keeps the CA key):
#
#   birdhub ca init --key ca.key --pub ca.pub
#
# On this machine, after the first start has generated `hub.key`:
#
#   birdhub identity export --key /etc/birdhub/keys/hub.key --pub hub.pub
#
# and on the CA machine:
#
#   birdhub ca issue --ca ca.key --identity hub.pub --days 365 --out hub.cert
#
# Then `ca.pub` sits at `[ca] public` below and `hub.cert` at `[identity]
# certificate`. A hub with papers it cannot verify — wrong CA, expired,
# certifying different keys — refuses to start, and says which of those it is.

[app]
mode = "hub"

[identity]
# Generated on first start, owner-readable only. This file *is* the hub: the
# certificate below binds it to the name `hub.example`, and a peer accepts
# nothing else wearing that name.
key_file = "/etc/birdhub/keys/hub.key"
name = "hub.example"
# The certificate `birdhub ca issue` wrote for this node's exported keys.
certificate = "/etc/birdhub/keys/hub.cert"

[ca]
# The fleet's trust anchor. This one file is the whole of the trust model:
# every client is verified against it during the handshake.
public = "/etc/birdhub/keys/ca.pub"

[hub_server]
# The only listener. There is no control plane: a client bootstraps from its
# own certificate and the hub's `hub.cert`, never from a request to this port.
data_address = "0.0.0.0:8388"
# One extra round trip for the client, one per attempt for an attacker, before
# the hub spends two SLH-DSA signatures on a caller.
require_cookie = true
handshake_ttl_secs = 60
replay_capacity = 4096

# The local read/write API — the surface the console (birdhub-console) and a
# future web portal drive, and the way a script reads fleet state. Off unless
# written down; bound exactly as written, so keep it on the loopback until an
# authenticated remote admin exists.
#
# GET  /status /fleet /grants /events
# POST /grants/reload  /sessions/{id}/disconnect
# PUT  /grants   (rewrites this file's [[grants]] — the rewrite loses comments)
#
# 0.0.0.0 because this file runs inside a container, where a connection
# forwarded through the published port arrives on the container's own
# interface, never on its loopback. The boundary is the published port,
# which compose maps to the host's loopback only. On a bare-metal hub,
# prefer "127.0.0.1:8399".
[control]
address = "0.0.0.0:8399"

# ------------------------------------------------------------------------------
# Who may connect, and what they may dial.
# ------------------------------------------------------------------------------
#
# Keyed by the *certificate subject id* the handshake proved — not by key_id,
# not by address. A client that completes a handshake but appears in no grant
# here is dropped before it can name a target. With no `[[grants]]` at all,
# this hub serves nobody; that is the default, and it is the safe direction.
#
# Targets are exact strings. No wildcards, no ranges: "which hosts may this
# client reach" is the question this table exists to answer, and a pattern
# language is a way to answer it differently than the operator read it.
#
# Two shapes:
#
#   "host:port"        the hub dials it for the client, as before.
#   "@peer/<subject>"  the hub pairs this client with that node and relays
#                      the two blindly; `<subject>/<service>` targets then
#                      travel between the peers, who check each other's
#                      certificates themselves. Entries are per pair: the
#                      <subject> node needs its own grant naming this client
#                      before the two can meet.
#
# The row is also the admission: a node with no row is refused at the
# handshake. A node that only *serves* — reachable by peers, dialing nothing
# itself — is admitted with an empty `targets`.
#
# A roster names the whole fleet, not only the nodes running beside this hub:
# `desktop.example` below is the native-binary node the mixed-fleet
# walkthrough joins to this same hub (TESTING.md, "Method 4"). A row for a
# node that is not connected admits nothing and reaches nothing until it is —
# it is an entry in the fleet, not a statement that the fleet is up.

[[grants]]
client = "laptop.example"
targets = ["origin:80"]

[[grants]]
client = "desktop.example"
targets = ["@peer/laptop.example"]

