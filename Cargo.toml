[workspace]
members = [".", "crates/temper", "console"]

[package]
name = "birdhub"
version = "1.0.0"
edition = "2021"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# -- Async
tokio = { version = "1", features = ["full"] }
# -- Logging
log = "0.4"
env_logger = "0.11"
# -- Encoding
serde = { version = "1", features = ["derive"] }
toml = "1.1.0"
postcard = { version = "1.0", features = ["alloc"] }
derive_more = { version = "2", features = ["from", "display"] }
# -- Must match the rand_core temper's TemperEntropy implements.
rand_core = "0.6"

# -- The local control API (control.rs) — the same version Splicer pairs with
# -- its tokio stack, and a plain JSON surface rather than a hand-rolled one.
axum = "0.8"
serde_json = "1"

# -- Vendored, with the session protocol's network transport. Vendored rather
# -- than a path dependency into CrucibleOS so the Docker build context is this
# -- repository alone. `scripts/sync-temper.sh` refreshes it from the source
# -- of truth and `--check` fails when they have drifted.
temper-rs = { path = "crates/temper", features = ["transport"] }

[dev-dependencies]
# Route-level API tests send requests through the real router with `oneshot`,
# which is how a route's status and body are asserted without a listener.
tower = { version = "0.5", features = ["util"] }
